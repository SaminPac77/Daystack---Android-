
name: Build DAYSTACK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract DAYSTACK
        run: |
          mkdir app
          unzip build-daystack-productivity-app.zip -d app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Add Capacitor Android
        working-directory: app
        run: |
          npm install --save \
            @capacitor/android@^7 \
            @capacitor/cli@^7

      - name: Build web application
        working-directory: app
        run: npm run build

      - name: Generate Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android project
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYSTACK-Android-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
